spring:
  application:
    name: fittoring-test
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${TEST_DATABASE_HOST}:${TEST_DATABASE_PORT}/${TEST_DATABASE_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${TEST_DATABASE_USER}
    password: ${TEST_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    datasource:
      hikari:
        pool-name: test-hikari
        maximum-pool-size: 10
        connection-timeout: 30000
        max-lifetime: 1800000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${TEST_DATABASE_HOST}:${TEST_DATABASE_PORT}/${TEST_DATABASE_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    user: ${TEST_DATABASE_USER}
    password: ${TEST_DATABASE_PASSWORD}
    baseline-on-migrate: false
    connect-retries: 10
sms:
  base-url: http://localhost:8089
  timeout:
    connect: 1
    read: 1
jwt:
  secret-key: my/test/secret/key/my/test/secret/key
  access-token-expiration-millis: 10000
  refresh-token-expiration-millis: 20000000
kakao:
  redirect-url: ${KAKAO_REDIRECT_URL}
  client-id: ${KAKAO_CLIENT_ID}

aws:
  s3:
    region: ap-northeast-2
    bucket-name: test-bucket
domain:
  sub-domain: test-sub-domain
