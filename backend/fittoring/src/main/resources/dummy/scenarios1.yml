      content: |
        몸무게 72kg이고 오늘 처음으로 60kg 5회 성공했습니다.
        깊이는 아직 자신 없지만 무게가 올라가니 재미가 생기네요.
    comments: []

  - category: 질문
    post:
      nickname: "단백질계산중"
      scheduled_at: "2026-05-04T16:35:00+09:00"
      title: "단백질은 체중 곱하기 몇으로 잡으면 될까요?"
      content: |
        체중은 68kg이고 근육을 늘리는 게 목표입니다.
        하루에 닭가슴살 한 팩, 계란 두 개 정도 먹고 있는데 부족한지 궁금합니다.
    comments:
