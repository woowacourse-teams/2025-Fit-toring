        content: "운동하면서 증량 목적이면 체중 1kg당 1.6g 전후로 잡아보세요."
      - nickname: "식사먼저"
        scheduled_at: "2026-05-04T16:46:00+09:00"
        content: "보충제보다 평소 식사에서 얼마나 먹는지 먼저 계산해보는 게 좋습니다."

  - category: 후기
    post:
      nickname: "아침헬스후기"
      scheduled_at: "2026-05-04T16:45:00+09:00"
      title: "한 달 동안 아침 운동으로 바꿔본 후기"
      content: |
        원래 퇴근 후에 운동했는데 사람이 많아서 아침 7시로 바꿨습니다.
        처음 일주일은 힘들었지만 지금은 기구 대기 시간이 줄어서 훨씬 만족합니다.
        대신 전날 잠을 늦게 자면 바로 운동 질이 떨어지네요.
    comments:
      - nickname: "저도아침파"
        scheduled_at: "2026-05-04T16:48:00+09:00"
        content: "아침 운동은 수면 시간이 진짜 핵심인 것 같습니다. 전날 준비까지 해두면 성공률 올라가요."
      - nickname: "퇴근러"
        scheduled_at: "2026-05-04T16:51:00+09:00"
        content: "퇴근 후 헬스장 너무 붐비는데 저도 한 번 바꿔봐야겠네요."
        replies:
          - nickname: "아침헬스후기"
            scheduled_at: "2026-05-04T16:55:00+09:00"
            content: "처음엔 주 2회만 해보세요. 갑자기 매일 바꾸면 피곤해서 금방 포기하게 되더라고요."

  - category: 식단
    post:
      nickname: "야식참는중"
      scheduled_at: "2026-05-04T16:54:00+09:00"
      title: "운동 끝나고 밤에 배고플 때 뭐 드시나요?"
      content: |
        저녁 운동을 하고 오면 10시쯤 배가 고픕니다.
        라면을 먹으면 다음 날 후회해서 가볍게 먹을 대안을 찾고 있습니다.
