scenarios:
  - category: 식단
    post:
      nickname: "저녁운동러"
      scheduled_at: "2026-05-04T16:00:00+09:00"
      title: "퇴근 후 운동 전에 바나나 하나면 충분할까요?"
      content: |
        오늘부터 퇴근하고 바로 헬스장에 가보려고 합니다.
        저녁을 먹고 가면 너무 더부룩할 것 같아서 바나나 하나만 먹고 가려는데,
        웨이트 1시간 정도 하기에는 에너지가 부족할까요?
    comments:
      - nickname: "탄수챙겨요"
        scheduled_at: "2026-05-04T16:04:00+09:00"
        content: "바나나 하나에 물 충분히 드시면 1시간 정도는 괜찮습니다. 대신 끝나고 식사는 꼭 챙기세요."
        replies:
          - nickname: "저녁운동러"
            scheduled_at: "2026-05-04T16:07:00+09:00"
            content: "운동 끝나고 닭가슴살이랑 밥 먹을 생각입니다. 그럼 괜찮겠네요."
            replies:
              - nickname: "탄수챙겨요"
                scheduled_at: "2026-05-04T16:11:00+09:00"
                content: "네, 운동 전에는 가볍게 먹고 운동 후에 탄단지 맞추는 쪽이 편합니다."
      - nickname: "소화느린편"
        scheduled_at: "2026-05-04T16:13:00+09:00"
        content: "저는 바나나에 아메리카노 반잔 정도 마시면 집중이 잘 되더라고요. 공복감 심하면 떡 하나 추가해도 좋아요."

  - category: 루틴
    post:
      nickname: "상체하체고민"
      scheduled_at: "2026-05-04T16:05:00+09:00"
      title: "주 3회면 무분할이 나을까요 2분할이 나을까요?"
      content: |
        헬스장 갈 수 있는 날이 월수금 정도입니다.
        지금은 가슴, 등, 하체를 조금씩 다 하는 무분할로 하고 있는데
        주변에서는 2분할로 바꾸라고 해서 고민입니다.
    comments:
      - nickname: "주3회무분할"
        scheduled_at: "2026-05-04T16:09:00+09:00"
        content: "주 3회면 무분할로 큰 동작 위주로 가져가는 게 더 낫다고 봅니다. 스쿼트, 벤치, 로우, 숄더프레스 정도요."
      - nickname: "볼륨조절"
        scheduled_at: "2026-05-04T16:16:00+09:00"
        content: "2분할도 가능은 한데 한 주에 어떤 부위는 한 번만 하게 될 수 있어서 초반엔 무분할 추천합니다."

  - category: 인증
    post:
      nickname: "첫오운완"
      scheduled_at: "2026-05-04T16:10:00+09:00"
      title: "헬스장 등록 첫날 오운완했습니다"
      content: |
        러닝 10분, 레그프레스, 랫풀다운, 체스트프레스만 가볍게 했습니다.
        기구 이름도 아직 헷갈리지만 그래도 시작했다는 게 뿌듯하네요.
    comments:
      - nickname: "시작이반"
        scheduled_at: "2026-05-04T16:12:00+09:00"
        content: "첫날에 무리 안 하고 가볍게 하신 게 좋습니다. 내일 근육통 와도 놀라지 마세요."
      - nickname: "운동일지추천"
        scheduled_at: "2026-05-04T16:19:00+09:00"
        content: "오늘 한 무게랑 횟수 적어두면 다음에 훨씬 편합니다."
        replies:
          - nickname: "첫오운완"
            scheduled_at: "2026-05-04T16:24:00+09:00"
            content: "메모장에 적어뒀습니다. 다음에는 조금씩 늘려볼게요."
      - nickname: "천천히가요"
        scheduled_at: "2026-05-04T16:31:00+09:00"
        content: "처음 한 달은 꾸준히 출석하는 게 제일 중요합니다. 잘하셨어요."

  - category: 질문
    post:
      nickname: "허리불안"
      scheduled_at: "2026-05-04T16:15:00+09:00"
      title: "데드리프트 할 때 허리가 뻐근하면 바로 중단해야 하나요?"
      content: |
        빈 봉으로 자세 연습 중인데 허리 아래쪽이 뻐근합니다.
        통증까지는 아닌데 계속해도 되는 건지 모르겠습니다.
        영상 찍어보니 등이 조금 말리는 것 같기도 합니다.
    comments:
      - nickname: "자세먼저"
        scheduled_at: "2026-05-04T16:18:00+09:00"
        content: "허리가 말리는 느낌이면 일단 중단하고 힙힌지부터 다시 잡는 게 좋습니다."
        replies:
          - nickname: "허리불안"
            scheduled_at: "2026-05-04T16:22:00+09:00"
            content: "힙힌지가 아직 잘 안 되는 것 같습니다. 루마니안부터 연습해도 될까요?"
            replies:
              - nickname: "자세먼저"
                scheduled_at: "2026-05-04T16:27:00+09:00"
                content: "네, 무게 없이 막대나 빈 봉으로 엉덩이를 뒤로 빼는 감각부터 익히세요."
                replies:
                  - nickname: "운동초보탈출"
                    scheduled_at: "2026-05-04T16:33:00+09:00"
                    content: "옆에서 영상 찍으면 바로 보입니다. 무릎을 너무 먼저 굽히는지도 확인해보세요."
                  - nickname: "코어잡기"
                    scheduled_at: "2026-05-04T16:36:00+09:00"
                    content: "복압 잡는 것도 같이 연습해보세요. 숨 들이마시고 배를 단단하게 만드는 느낌입니다."
      - nickname: "통증이면병원"
        scheduled_at: "2026-05-04T16:25:00+09:00"
        content: "뻐근함과 찌릿한 통증은 다릅니다. 찌릿하거나 다리까지 내려가면 운동하지 말고 진료 보세요."
      - nickname: "트레이너한번"
        scheduled_at: "2026-05-04T16:42:00+09:00"
        content: "데드는 초반에 한 번만 봐줘도 시행착오가 많이 줄어서 가능하면 피티 1회라도 추천합니다."

  - category: 식단
    post:
      nickname: "도시락입문"
      scheduled_at: "2026-05-04T16:20:00+09:00"
      title: "회사 점심 도시락으로 닭가슴살만 먹으면 질릴까요?"
      content: |
        다이어트 시작해서 점심 도시락을 싸보려고 합니다.
        닭가슴살, 현미밥, 샐러드 조합으로 계속 먹어도 괜찮을지
        오래 해보신 분들 팁이 궁금합니다.
    comments:
      - nickname: "소스가생명"
        scheduled_at: "2026-05-04T16:23:00+09:00"
        content: "소스랑 조리법을 바꿔야 오래 갑니다. 매운맛, 데리야끼맛, 카레가루 번갈아 쓰면 덜 질려요."
      - nickname: "냉동야채추천"
        scheduled_at: "2026-05-04T16:29:00+09:00"
        content: "냉동 브로콜리나 혼합야채 넣으면 준비 시간이 줄어서 유지하기 좋습니다."
      - nickname: "지속가능식단"
        scheduled_at: "2026-05-04T16:38:00+09:00"
        content: "매일 같은 메뉴보다 주 2회 정도는 일반식으로 조절하는 게 오래 갑니다."
        replies:
          - nickname: "도시락입문"
            scheduled_at: "2026-05-04T16:43:00+09:00"
            content: "일반식도 완전히 끊을 필요는 없군요. 그게 더 현실적이네요."
      - nickname: "계란추가"
        scheduled_at: "2026-05-04T16:52:00+09:00"
        content: "닭가슴살만 힘들면 삶은 계란이나 두부로 단백질원을 돌려보세요."

  - category: 루틴
    post:
      nickname: "풀업언제쯤"
      scheduled_at: "2026-05-04T16:25:00+09:00"
      title: "풀업 0개인데 등 운동은 어떻게 시작하면 좋을까요?"
      content: |
        매달리기는 15초 정도 가능한데 풀업은 하나도 못 합니다.
        랫풀다운만 계속하면 언젠가 풀업이 될까요?
    comments: []

  - category: 인증
