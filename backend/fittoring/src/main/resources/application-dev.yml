spring:
  datasource:
    url: jdbc:mysql://${DEV_DATABASE_HOST}:${DEV_DATABASE_PORT}/${DEV_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DEV_DATABASE_USER}
    password: ${DEV_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
      minimum-idle: ${HIKARI_MINIMUM_IDLE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
  jpa:
    show-sql: true
  flyway:
    enabled: true
    url: jdbc:mysql://${DEV_DATABASE_HOST}:${DEV_DATABASE_PORT}/${DEV_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    user: ${DEV_DATABASE_USER}
    password: ${DEV_DATABASE_PASSWORD}
    baseline-on-migrate: true
    out-of-order: true
cookie:
  same-site: ${COOKIE_SAME_SITE_DEV}
aws:
  s3:
    env-prefix: dev/
  sqs:
    image-queue: fittoring-image-queue
fcm:
  service-account-key: ${FCM_SERVICE_ACCOUNT_KEY}
