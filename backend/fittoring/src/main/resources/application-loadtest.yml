spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
      minimum-idle: ${HIKARI_MINIMUM_IDLE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
    out-of-order: true
  cloud:
    aws:
      sqs:
        enabled: true
cookie:
  same-site: ${COOKIE_SAME_SITE_DEV}
aws:
  s3:
    env-prefix: local/
  sqs:
    image-queue: fittoring-image-queue
