spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${PROD_DATABASE_HOST}:${PROD_DATABASE_PORT}/${PROD_DATABASE_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${PROD_DATABASE_USER}
    password: ${PROD_DATABASE_PASSWORD}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${PROD_DATABASE_HOST}:${PROD_DATABASE_PORT}/${PROD_DATABASE_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    user: ${PROD_DATABASE_USER}
    password: ${PROD_DATABASE_PASSWORD}
    baseline-on-migrate: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
      path-mapping:
        health: healthcheck
  metrics:
    tags:
      application: fittoring
    export:
      cloudwatch:
        enabled: true
        namespace: fittoring-backend-dev
        step: 30s
        batch-size: 20
        region: ap-northeast-2
sms:
  base-url: https://api.solapi.com
  timeout:
    connect: 1_200
    read: 5_000
logging:
  file:
    name: /logs/application.log
  level:
    root: INFO
    fittoring.mentoring: DEBUG
  pattern:
    file: "%msg%n"
    console: "%msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: logs/application.%d{yyyy-MM}.%i.log
      max-history: 2
      max-file-size: 10MB
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration-millis: ${ACCESS_TOKEN_EXPIRATION_MILLIS}
  refresh-token-expiration-millis: ${REFRESH_TOKEN_EXPIRATION_MILLIS}
kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI}
  client-id: ${KAKAO_CLIENT_ID}
