version: 0.0
os: linux

files:
  - source: docker-compose.yml
    destination: /home/ssm-user/fittoring-deploy
  - source: appspec.yml
    destination: /home/ssm-user/fittoring-deploy
  - source: image_tag.txt
    destination: /home/ssm-user/fittoring-deploy
  - source: scripts/
    destination: /home/ssm-user/fittoring-deploy/scripts

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 180
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
