version: 0.2

phases:
  install:
    commands:
      - echo "Docker가 사전 설치된 표준 빌드 이미지를 사용합니다."
      - echo "buildx 빌드 활성화 중..."
      - docker buildx create --use

  pre_build:
    commands:
      - echo "Docker Hub에 로그인합니다..."
      - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - cd backend/fittoring

  build:
    commands:
      - "echo 'Gradle Wrapper에 실행 권한을 부여합니다...'"
      - "chmod +x ./gradlew"

      - "echo 'Gradle을 사용하여 Jar 파일을 빌드합니다.'"
      - "./gradlew clean"
      #      - "./gradlew generateApiDocs"
      - "./gradlew bootJar -x test"

      - "IMAGE_TAG=prod-sha-$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "REPOSITORY_URI=\"$DOCKERHUB_USERNAME/fittoring\""
      - "echo 'Docker 이미지를 ARM64용으로 빌드하고 푸시합니다... Tag:' $IMAGE_TAG"
      - "docker buildx build --platform linux/arm64 \
         -t $REPOSITORY_URI:$IMAGE_TAG \
         -t $REPOSITORY_URI:prod \
         --push ."

  post_build:
    commands:
      - echo "배포용 이미지 태그 저장"
      - echo $IMAGE_TAG > image_tag.txt
      - echo "SSM Parameter Store(/fittoring/prod/)에서 환경변수를 가져와 .env 생성"
      - aws ssm get-parameters-by-path --path "/fittoring/prod/" --recursive --with-decryption --output json > /tmp/ssm-params.json
      - jq -r '.Parameters[] | "\(.Name | sub("^.*/"; ""))=\(.Value)"' /tmp/ssm-params.json > .env
      - test -s .env
      - wc -l .env

artifacts:
  base-directory: backend/fittoring
  files:
    - appspec.yml
    - docker-compose.yml
    - image_tag.txt
    - deployscripts/**/*
    - .env
