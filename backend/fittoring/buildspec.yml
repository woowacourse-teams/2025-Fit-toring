version: 0.2

phases:
  install:
    commands:
      - echo "Docker가 사전 설치된 표준 빌드 이미지를 사용합니다."

  pre_build:
    commands:
      - "echo 'Docker Hub에 로그인합니다...'"
      - "echo \"$DOCKERHUB_TOKEN\" | docker login --username \"$DOCKERHUB_USERNAME\" --password-stdin"
      - "echo '/backend/fittoring 디렉터리로 이동합니다...'"
      - "cd backend/fittoring"

  build:
    commands:
      - "echo 'Gradle Wrapper에 실행 권한을 부여합니다...'"
      - "chmod +x ./gradlew"

      - "echo 'Gradle을 사용하여 Jar 파일을 빌드합니다.'"
      - "./gradlew clean"
      # - "./gradlew generateApiDocs"
      - "./gradlew bootJar"

      - "IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "REPOSITORY_URI=\"$DOCKERHUB_USERNAME/fittoring/fittoring\""
      - "echo 'Docker 이미지를 빌드합니다... Tag:' $IMAGE_TAG"
      - "docker build -t $REPOSITORY_URI:$IMAGE_TAG ."

  post_build:
    commands:
      - "echo '빌드된 이미지를 Docker Hub로 Push합니다...'"
      - "docker push $REPOSITORY_URI:$IMAGE_TAG"

      - "echo '배포에 사용할 image_tag.txt 파일을 생성합니다...'"
      - "echo $IMAGE_TAG > image_tag.txt"

artifacts:
  base-directory: backend/fittoring/deploysettings
  files:
    - appspec.yml
    - docker-compose.yml
    - image_tag.txt
    - scripts/**/*
