name: Backend CI/CD

on:
  pull_request:
    branches: [ release-dev ]
    paths: [ 'backend/**' ]
  push:
    branches: [ release-dev ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: fittoring/fittoring
    defaults:
      run:
        working-directory: backend/fittoring
    outputs:
      image_tag: ${{ steps.tags.outputs.dev_tag }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean generateApiDocs bootJar

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set tags
        id: tags
        run: |
          echo "dev_tag=dev" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend/fittoring
          file: backend/fittoring/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.dev_tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy-dev:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on:
      - self-hosted
      - dev
    env:
      IMAGE: fittoring/fittoring   
      TAG: ${{ needs.build-and-push.outputs.image_tag }}
      PROFILE: dev
    steps:
      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        
      - name: Run deploy script   
        run: |
          cd /home/ubuntu
          IMAGE="${IMAGE}" TAG="${TAG}" PROFILE="${PROFILE}" ./deploy-be.sh
