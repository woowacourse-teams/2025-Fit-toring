name: Backend CI/CD

on:
  pull_request:
    branches: [ release-dev ]
    paths: [ 'backend/**' ]
  push:
    branches: [ release-dev ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: fittoring/fittoring
    defaults:
      run:
        working-directory: backend/fittoring

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          if ! docker compose version; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          if ! command -v nc >/dev/null 2>&1; then
            sudo apt-get install -y netcat-openbsd
          fi

      - name: Start MySQL containers with Docker Compose
        run: docker compose -f ./docker-compose.yml up -d db-test

      - name: Wait for Test MySQL
        run: |
          echo "Waiting for Test MySQL..."
          for i in {30..0}; do
            nc -z localhost 3307 && echo "Test MySQL is up!" && break
            echo "Still waiting for MySQL..."
            sleep 2
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env file
        run: |
          echo "ACTIVE_PROFILE=test" >> .env
          echo "TEST_DATABASE_HOST=localhost" >> .env
          echo "TEST_DATABASE_PORT=3307" >> .env
          echo "TEST_DATABASE_NAME=fittoring-test" >> .env
          echo "TEST_DATABASE_USER=root" >> .env
          echo "TEST_DATABASE_PASSWORD=1234" >> .env
          echo "COOL_SMS_FROM_PHONE=${{ secrets.COOL_SMS_FROM_PHONE }}" >> .env
          echo "COOL_SMS_HMAC_HEADER=HMAC-SHA256" >> .env
          echo "COOL_SMS_HMAC_HASH=HmacSHA256" >> .env
          echo "COOL_SMS_API_KEY=${{ secrets.COOL_SMS_API_KEY }}" >> .env
          echo "COOL_SMS_SECRET_KEY=${{ secrets.COOL_SMS_SECRET_KEY }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "ACCESS_TOKEN_EXPIRATION_MILLIS=${{ secrets.ACCESS_TOKEN_EXPIRATION_MILLIS }}" >> .env
          echo "REFRESH_TOKEN_EXPIRATION_MILLIS=${{ secrets.REFRESH_TOKEN_EXPIRATION_MILLIS }}" >> .env
          echo "KAKAO_REDIRECT_URL=https://dev.fittoring.com/kakao/callback" >> .env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "TRACING_ENABLE=${{ secrets.TRACING_ENABLE }}" >> .env
          echo "TEMPO_GRPC_LISTENER_URL=${{ secrets.TEMPO_GRPC_LISTENER_URL }}" >> .env
          echo "DB_TRACING_ENABLE=${{ secrets.DB_TRACING_ENABLE }}" >> .env
          echo "METRICS_EXPORT_TIME_TO_PROMETHEUS=${{ secrets.METRICS_EXPORT_TIME_TO_PROMETHEUS }}" >> .env
          echo "HIKARI_MAXIMUM_POOL_SIZE=${{ secrets.HIKARI_MAXIMUM_POOL_SIZE }}" >> .env
          echo "HIKARI_MINIMUM_IDLE=${{ secrets.HIKARI_MINIMUM_IDLE }}" >> .env
          echo "HIKARI_CONNECTION_TIMEOUT=${{ secrets.HIKARI_CONNECTION_TIMEOUT }}" >> .env
          echo "HIKARI_MAX_LIFETIME=${{ secrets.HIKARI_MAX_LIFETIME }}" >> .env
          echo "TOMCAT_MAX_THREADS=${{ secrets.TOMCAT_MAX_THREADS }}" >> .env
          echo "TOMCAT_MAX_CONNECTIONS=${{ secrets.TOMCAT_MAX_CONNECTIONS }}" >> .env
          echo "TOMCAT_CONNECTION_TIMEOUT=${{ secrets.TOMCAT_CONNECTION_TIMEOUT }}" >> .env
          echo "TOMCAT_KEEP_ALIVE_TIMEOUT=${{ secrets.TOMCAT_KEEP_ALIVE_TIMEOUT }}" >> .env
          echo "AWS_IAM_ACCESS_KEY=${{ secrets.AWS_IAM_ACCESS_KEY }}" >> .env
          echo "AWS_IAM_SECRET_KEY=${{ secrets.AWS_IAM_SECRET_KEY }}" >> .env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('./**/*.gradle*', './**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Build Admin Page (back-office)
        run: |
          cd ../back-office
          npm ci
          npm run build

      - name: Generate API docs
        run: ./gradlew generateApiDocs

      - name: Build jar
        run: ./gradlew bootJar

      - name: Stop Docker containers (test DB)
        if: always()
        run: docker compose -f ./docker-compose.yml down

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          DEV_TAG="dev"
          DEV_SHA_TAG="dev-sha-$SHORT_SHA"
          STG_TAG="stg"
          STG_SHA_TAG="stg-sha-$SHORT_SHA"

          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
          echo "dev_sha_tag=$DEV_SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "stg_tag=$STG_TAG" >> "$GITHUB_OUTPUT"
          echo "stg_sha_tag=$STG_SHA_TAG" >> "$GITHUB_OUTPUT"

          echo "[INFO] dev_tag=$DEV_TAG"
          echo "[INFO] dev_sha_tag=$DEV_SHA_TAG"
          echo "[INFO] stg_tag=$STG_TAG"
          echo "[INFO] stg_sha_tag=$STG_SHA_TAG"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend/fittoring
          file: backend/fittoring/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.dev_tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.dev_sha_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Build & Push ARM only (stg)
        uses: docker/build-push-action@v6
        with:
          context: backend/fittoring
          file: backend/fittoring/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.stg_tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.stg_sha_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-arm64,mode=max

  deploy-dev:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on:
      - self-hosted
      - dev
      - X64 # AMD64 아키텍처를 사용하는 런너에서만 실행
    env:
      IMAGE: fittoring/fittoring
      PROFILE: dev

    steps:
      - name: Compute deploy tag
        shell: bash
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "TAG=dev-sha-$SHORT_SHA" >> "$GITHUB_ENV"
          echo "[INFO] Computed TAG=dev-sha-$SHORT_SHA"

      - name: Debug deploy env
        run: |
          echo "IMAGE=$IMAGE"
          echo "TAG=$TAG"
          echo "PROFILE=$PROFILE"

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Run deploy script
        shell: bash
        run: |
          cd /home/ubuntu
          IMAGE="$IMAGE" TAG="$TAG" PROFILE="$PROFILE" ./deploy-be.sh

  test-report:
    if: failure()
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            backend/fittoring/build/reports/tests/test
            backend/fittoring/build/test-results/test
