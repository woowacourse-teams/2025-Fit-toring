name: 'frontend-vitest test'

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-vitest.yml'

jobs:
  Vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci # package-lock.json 기반으로 설치 (CI 환경에 권장)
        working-directory: ./frontend # frontend 디렉토리에서 실행

      # 테스트 전용 더미 환경변수 파일(.env.test)을 생성합니다.
      - name: Generate test environment variables
        run: |
          echo "API_BASE_URL=http://localhost:8080" >> .env.test
          echo "SENTRY_DSN=https://dummy-sentry.io" >> .env.test
          echo "KAKAO_REDIRECT_URL=http://localhost:3000/dummy" >> .env.test
          echo "SENTRY_AUTH_TOKEN=dummy_token" >> .env.test
          echo "GOOGLE_ANALYTICS_ID=dummy_ga_id" >> .env.test
          echo "KAKAO_REST_API_KEY=dummy_kakao_key" >> .env.test
          echo "CHANNEL_TALK_PLUGIN_KEY=dummy_channel_talk_key" >> .env.test
        working-directory: ./frontend # frontend 디렉토리에서 실행

      - name: Run Vitest
        run: npm run test # package.json에 정의된 test 스크립트 실행
        working-directory: ./frontend # frontend 디렉토리에서 실행
