version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd frontend
      - npm install
  build:
    commands:
      - |
        if [ "$APP_ENV" = "production" ]; then
          echo "✅ Building for PRODUCTION..."
          npm run build:prod
          S3_PATH="s3://techcourse-project-2025/fit-toring/prod/dist"
        elif [ "$APP_ENV" = "development" ]; then
          echo "✅ Building for DEVELOPMENT..."
          npm run build:dev
          S3_PATH="s3://techcourse-project-2025/fit-toring/dev/dist"
        else
          echo "❌ Unknown APP_ENV. Halting build."
          exit 1
        fi
      - echo "📦 Target S3 path: $S3_PATH"

  post_build:
    commands:
      - echo "🚀 Deploying to $S3_PATH with proper cache headers..."
      - aws s3 cp dist/index.html $S3_PATH/index.html \
        --cache-control "no-store" \
        --content-type "text/html" \
        --metadata-directive REPLACE
      - aws s3 sync dist $S3_PATH/ \
        --exclude "index.html" \
        --cache-control "public, max-age=31536000, immutable" \
        --metadata-directive REPLACE
      - aws s3 cp s3://techcourse-project-2025/fit-toring/certificate-image/ \
        s3://techcourse-project-2025/fit-toring/certificate-image/ \
        --recursive \
        --metadata-directive REPLACE \
        --cache-control "public, max-age=31536000, immutable"
      - aws s3 cp s3://techcourse-project-2025/fit-toring/profile-image/ \
        s3://techcourse-project-2025/fit-toring/profile-image/ \
        --recursive \
        --metadata-directive REPLACE \
        --cache-control "public, max-age=31536000, immutable"

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'
